name: C++ CI

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ libopencv-dev

      - name: Configure CMake
        run: cmake -S . -B build 

      - name: Build
        run: cmake --build build

      - name: Run tests
        run: |
          if [ -f build/test_collagrcms_core ]; then
            ./build/test_collagrcms_core
          else
            echo "No test binary found."
            exit 1
          fi
