[project]
name = "collagrcms"
version = "0.1.0"
description = "Backend service"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115.12",
    "pillow>=11.2.1",
    "pydantic>=2.11.5",
    "pytest>=8.3.5",
    "sqlalchemy>=2.0.41",
    "uvicorn>=0.34.3",
]

[tool.uv]
dev-dependencies = ["ruff>=0.11.7"]

[tool.ruff.lint]
select = ["E", "F", "B"]
ignore = ["E501"]
